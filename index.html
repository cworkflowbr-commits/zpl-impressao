<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ZPL // Impressão</title>
<style id="pageStyle">@page { size: 50mm 25mm; margin: 0; }</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0e0c;
    --panel: #0f1613;
    --borda: #1d3a2b;
    --verde: #39ff88;
    --verde-dim: #1f9d55;
    --texto: #c9f7dc;
    --muted: #5c7a6a;
    --erro: #ff4d6d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    color: var(--texto);
    background:
      radial-gradient(circle at 20% 0%, rgba(57,255,136,0.08), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(57,255,136,0.05), transparent 40%),
      var(--bg);
    padding: 32px 16px;
  }

  .container { max-width: 860px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--borda);
    padding-bottom: 12px; margin-bottom: 22px;
  }
  h1 {
    margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 2px;
    color: var(--verde); text-shadow: 0 0 12px rgba(57,255,136,0.5);
  }
  h1 span { color: var(--muted); }
  .badge {
    font-size: 11px; color: var(--verde); border: 1px solid var(--verde-dim);
    padding: 3px 8px; border-radius: 3px; letter-spacing: 1px;
  }

  .painel {
    background: var(--panel);
    border: 1px solid var(--borda);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 0 24px rgba(57,255,136,0.04) inset;
  }
  .label-titulo {
    font-size: 11px; letter-spacing: 2px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 8px; display: block;
  }

  textarea {
    width: 100%; height: 260px; resize: vertical;
    background: #060906; color: var(--verde);
    border: 1px solid var(--borda); border-radius: 4px;
    padding: 12px; font-family: inherit; font-size: 13px; line-height: 1.5;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus {
    border-color: var(--verde-dim);
    box-shadow: 0 0 0 1px var(--verde-dim), 0 0 18px rgba(57,255,136,0.15);
  }
  textarea::placeholder { color: var(--muted); }
  textarea.arrastando {
    border: 1px dashed var(--verde);
    background: #08140e;
    box-shadow: 0 0 24px rgba(57,255,136,0.25);
  }

  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }

  label.campo { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  input[type=number], select {
    margin-top: 6px; width: 96px;
    background: #060906; color: var(--texto);
    border: 1px solid var(--borda); border-radius: 4px;
    padding: 9px 10px; font-family: inherit; font-size: 14px; outline: none;
  }
  select { width: 130px; }
  input[type=number]:focus, select:focus { border-color: var(--verde-dim); }

  button {
    font-family: inherit; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    padding: 10px 18px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--verde-dim); background: transparent; color: var(--verde);
    transition: all .15s;
  }
  button:hover {
    background: var(--verde); color: #04110a;
    box-shadow: 0 0 18px rgba(57,255,136,0.5);
  }
  button.primario {
    background: var(--verde); color: #04110a; border-color: var(--verde); font-weight: 600;
    box-shadow: 0 0 16px rgba(57,255,136,0.35);
  }
  button.primario:hover { background: #7dffb0; box-shadow: 0 0 26px rgba(57,255,136,0.7); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .acoes { margin-left: auto; }

  #info { font-size: 12px; color: var(--verde); min-height: 1.2em; margin-top: 12px; }
  #info::before { content: "> "; color: var(--verde-dim); }
  #status { font-size: 12px; color: var(--muted); min-height: 1.2em; margin-top: 6px; }
  #status::before { content: "$ "; color: var(--verde-dim); }
  #status.erro { color: var(--erro); }
  #status.erro::before { color: var(--erro); }

  #printArea { display: none; }

  @media print {
    html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; margin: 0; padding: 0; }
    #printArea img { display: block; image-rendering: pixelated; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>ZPL<span>//</span>PRINT</h1>
    <span class="badge">LABEL ENGINE</span>
  </header>

  <div class="painel">
    <span class="label-titulo">Código ZPL</span>
    <textarea id="zpl" placeholder="Cole o código ZPL aqui, arraste um arquivo .txt/.zpl ou use o botão Abrir arquivo"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="btnAbrir">Abrir arquivo</button>
      <input type="file" id="arquivo" accept=".txt,.zpl,text/plain" hidden>
    </div>
    <div id="info"></div>
  </div>

  <div class="painel">
    <span class="label-titulo">Parâmetros</span>
    <div class="row">
      <label class="campo">Largura (mm)
        <input type="number" id="w" value="50" step="0.1" min="1">
      </label>
      <label class="campo">Altura (mm)
        <input type="number" id="h" value="25" step="0.1" min="1">
      </label>
      <label class="campo">Resolução
        <select id="dpi">
          <option value="6">150 dpi</option>
          <option value="8" selected>203 dpi</option>
          <option value="12">300 dpi</option>
          <option value="24">600 dpi</option>
        </select>
      </label>
      <div class="acoes">
        <button id="btnPrint" class="primario">Imprimir · Ctrl+Enter</button>
      </div>
    </div>
    <div id="status"></div>
  </div>

</div>

<div id="printArea">
  <img id="labelImg" alt="Etiqueta">
</div>

<script>
const $ = id => document.getElementById(id);
const zplEl = $('zpl');
const statusEl = $('status');
const infoEl = $('info');
const img = $('labelImg');
const pageStyle = $('pageStyle');

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('erro', isError);
}

// Lê ^PW (largura) e ^LL (altura) do ZPL e converte pontos em mm
function detectarTamanho(zpl) {
  const pw = zpl.match(/\^PW(\d+)/);
  const ll = zpl.match(/\^LL(\d+)/);
  const dpmm = parseInt($('dpi').value, 10);
  const resultado = {};
  if (pw) resultado.w = Math.round((parseInt(pw[1], 10) / dpmm) * 10) / 10;
  if (ll) resultado.h = Math.round((parseInt(ll[1], 10) / dpmm) * 10) / 10;
  return resultado;
}

function aplicarTamanhoDetectado() {
  const zpl = zplEl.value;
  if (!zpl.trim()) { infoEl.textContent = ''; return; }

  const { w, h } = detectarTamanho(zpl);
  const partes = [];

  if (w) { $('w').value = w; partes.push(`largura ${w} mm`); }
  if (h) { $('h').value = h; partes.push(`altura ${h} mm`); }

  infoEl.textContent = partes.length
    ? `Tamanho detectado no ZPL: ${partes.join(' × ')}`
    : 'Tamanho não encontrado no ZPL (^PW/^LL). Usando os valores dos campos.';
}

// Carrega o conteúdo de um arquivo (.txt ou .zpl) na caixa de texto
async function carregarArquivo(file) {
  zplEl.value = await file.text();
  aplicarTamanhoDetectado();
  setStatus(`Arquivo carregado: ${file.name}`);
  zplEl.focus();
}

// Busca a etiqueta renderizada como PNG no Labelary
async function renderZpl(zplRaw, w, h, dpmm) {
  const zpl = zplRaw.replace(/\^PQ[^^~]*/g, '^PQ1,0,1,Y');

  const wIn = (w / 25.4).toFixed(4);
  const hIn = (h / 25.4).toFixed(4);
  const url = `https://api.labelary.com/v1/printers/${dpmm}dpmm/labels/${wIn}x${hIn}/0/`;

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'Accept': 'image/png'
    },
    body: zpl
  });

  if (!res.ok) {
    throw new Error(`Erro ao renderizar o ZPL (${res.status}): ${await res.text()}`);
  }
  return res.blob();
}

// Converte a imagem para preto e branco puro (impressoras térmicas não imprimem tons de cinza)
async function paraPretoEBranco(blob) {
  const bmp = await createImageBitmap(blob);
  const canvas = document.createElement('canvas');
  canvas.width = bmp.width;
  canvas.height = bmp.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    const cinza = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    const v = cinza < 128 ? 0 : 255;
    px[i] = px[i + 1] = px[i + 2] = v;
    px[i + 3] = 255;
  }
  ctx.putImageData(data, 0, 0);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

let printing = false;

async function imprimir() {
  if (printing) return;
  const zpl = zplEl.value.trim();
  if (!zpl) { setStatus('Cole o código ZPL primeiro.', true); return; }

  aplicarTamanhoDetectado();

  const w = parseFloat($('w').value);
  const h = parseFloat($('h').value);
  if (!(w > 0 && h > 0)) { setStatus('Informe largura e altura válidas.', true); return; }

  try {
    printing = true;
    setStatus('Renderizando etiqueta...');

    const blob = await renderZpl(zpl, w, h, $('dpi').value);
    const blobPB = await paraPretoEBranco(blob);

    if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
    const url = URL.createObjectURL(blobPB);
    img.dataset.url = url;
    img.src = url;
    await img.decode();

    pageStyle.textContent = `@page { size: ${w}mm ${h}mm; margin: 0; }`;
    img.style.width = `${w}mm`;
    img.style.height = `${h}mm`;

    setStatus('Abrindo impressão...');
    window.print();
  } catch (err) {
    setStatus(err.message, true);
    printing = false;
  }
}

// Botão Abrir arquivo
$('btnAbrir').addEventListener('click', () => $('arquivo').click());
$('arquivo').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (file) await carregarArquivo(file);
  e.target.value = '';
});

// Arrastar e soltar um arquivo na caixa de texto
zplEl.addEventListener('dragover', e => { e.preventDefault(); zplEl.classList.add('arrastando'); });
zplEl.addEventListener('dragleave', () => zplEl.classList.remove('arrastando'));
zplEl.addEventListener('drop', async e => {
  e.preventDefault();
  zplEl.classList.remove('arrastando');
  const file = e.dataTransfer.files[0];
  if (file) await carregarArquivo(file);
});

// Quando o arquivo é aberto pelo sistema (duplo clique, com o app instalado)
if ('launchQueue' in window) {
  window.launchQueue.setConsumer(async params => {
    if (!params.files || !params.files.length) return;
    const file = await params.files[0].getFile();
    await carregarArquivo(file);
  });
}

// Ao colar o ZPL, detecta o tamanho automaticamente
zplEl.addEventListener('input', aplicarTamanhoDetectado);

// Depois de imprimir (ou cancelar), limpa o campo para o próximo código
window.addEventListener('afterprint', () => {
  printing = false;
  zplEl.value = '';
  infoEl.textContent = '';
  setStatus('Pronto. Cole o próximo código.');
  zplEl.focus();
});

$('btnPrint').addEventListener('click', imprimir);

zplEl.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') imprimir();
});

zplEl.focus();
</script>
</body>
</html>
